<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="170">
  <defs>
    <linearGradient id="stats-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#0E172A" />
    </linearGradient>
    <style>
      .stat-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 26px; font-weight: 800; fill: #00F0FF; }
      .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F8FAFC; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="900" height="170" rx="14" fill="url(#stats-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Left: Activity Metrics -->
  <g transform="translate(30, 25)">
    <text x="0" y="16" class="header-title" fill="#8B5CF6">📊 GITHUB ACTIVITY &amp; STATS</text>

    <!-- Metric 1 -->
    <g transform="translate(0, 45)">
      <text x="0" y="24" class="stat-num">5</text>
      <text x="0" y="44" class="stat-label">Public Repositories</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(130, 45)">
      <text x="0" y="24" class="stat-num" fill="#8B5CF6">Active</text>
      <text x="0" y="44" class="stat-label">Building &amp; Shipping</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(235, 45)">
      <text x="0" y="24" class="stat-num" fill="#10B981">Daily</text>
      <text x="0" y="44" class="stat-label">Actions Sync</text>
    </g>
  </g>

  <!-- Divider line -->
  <line x1="345" y1="25" x2="345" y2="145" stroke="#1E293B" stroke-width="1.5" />

  <!-- Right: Top Languages Distribution -->
  <text x="380" y="41" class="header-title" fill="#00F0FF">⚡ TOP REPOSITORY LANGUAGES</text>
  <rect x="380" y="85" width="480" height="10" rx="3" fill="#1E293B" />
  <g>
    <rect x="380.0" y="85" width="88.0" height="10" rx="3" fill="#00F0FF" />
    <rect x="468.0" y="85" width="88.0" height="10" rx="3" fill="#8B5CF6" />
    <rect x="556.0" y="85" width="88.0" height="10" rx="3" fill="#38BDF8" />
    <rect x="644.0" y="85" width="88.0" height="10" rx="3" fill="#F59E0B" />
    <rect x="732.0" y="85" width="88.0" height="10" rx="3" fill="#10B981" />
  </g>
  <g>
    <circle cx="380" cy="121" r="4" fill="#00F0FF" /><text x="390" y="125" font-family="sans-serif" font-size="12" fill="#94A3B8">JavaScript <tspan fill="#F1F5F9" font-weight="600">20%</tspan></text>
    <circle cx="535" cy="121" r="4" fill="#8B5CF6" /><text x="545" y="125" font-family="sans-serif" font-size="12" fill="#94A3B8">HTML <tspan fill="#F1F5F9" font-weight="600">20%</tspan></text>
    <circle cx="690" cy="121" r="4" fill="#38BDF8" /><text x="700" y="125" font-family="sans-serif" font-size="12" fill="#94A3B8">TypeScript <tspan fill="#F1F5F9" font-weight="600">20%</tspan></text>
    <circle cx="380" cy="145" r="4" fill="#F59E0B" /><text x="390" y="149" font-family="sans-serif" font-size="12" fill="#94A3B8">CSS <tspan fill="#F1F5F9" font-weight="600">20%</tspan></text>
    <circle cx="535" cy="145" r="4" fill="#10B981" /><text x="545" y="149" font-family="sans-serif" font-size="12" fill="#94A3B8">Java <tspan fill="#F1F5F9" font-weight="600">20%</tspan></text>
  </g>
</svg>